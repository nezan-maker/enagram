<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Escalated</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #dc3545; color: #ffffff; padding: 24px 32px; }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .body { padding: 32px; }
    .body p { color: #333; font-size: 15px; line-height: 1.6; margin: 0 0 16px; }
    .priority-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .priority-critical { background: #dc3545; color: #fff; }
    .priority-high { background: #fd7e14; color: #fff; }
    .priority-medium { background: #ffc107; color: #212529; }
    .priority-low { background: #28a745; color: #fff; }
    .detail-box { background: #f8f9fa; border-left: 4px solid #dc3545; padding: 16px 20px; margin: 20px 0; border-radius: 0 4px 4px 0; }
    .detail-box dt { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-box dd { margin: 0 0 12px; font-size: 15px; color: #222; font-weight: 500; }
    .detail-box dd:last-child { margin-bottom: 0; }
    .btn { display: inline-block; background: #dc3545; color: #ffffff !important; padding: 14px 32px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; margin: 12px 0; }
    .footer { padding: 20px 32px; background: #fafafa; border-top: 1px solid #eee; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Enagram — Issue Escalated</h1>
    </div>
    <div class="body">
      <p>Hello {{managerName}},</p>
      <p>An issue has been escalated and requires your immediate attention:</p>
      <div class="detail-box">
        <dl>
          <dt>Title</dt>
          <dd>{{issueTitle}}</dd>
          <dt>Priority</dt>
          <dd><span class="priority-badge priority-{{priority}}">{{priority}}</span></dd>
          <dt>Category</dt>
          <dd>{{category}}</dd>
        </dl>
      </div>
      <p style="text-align: center;">
        <a href="{{issueUrl}}" class="btn">View Issue</a>
      </p>
    </div>
    <div class="footer">
      This is an automated notification from Enagram. Please do not reply to this email.
    </div>
  </div>
</body>
</html>
