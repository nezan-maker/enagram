# ── Enagram Restaurant OS ──
# Orchestrates: Backend (Express), Frontend (React/Vite)
# Database: MongoDB Atlas (set MONGO_URI in .env)

services:

  # ── Backend API ──
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: enagram-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - UPLOAD_DIR=/app/dist/uploads
    volumes:
      - uploads_data:/app/dist/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend SPA ──
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:4000/api/v1
    container_name: enagram-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads_data:
    driver: local
